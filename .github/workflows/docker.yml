# Builds the Docker image for two kinds of computer, checks that each one works, and, when a version tag
# (for example v2.0.1) is pushed, publishes both to the GitHub Container Registry as ONE image name that picks
# the right one automatically, and attaches a saved copy of each, with its checksum, to the release.
#   amd64 = most servers, Windows and Intel Macs;   arm64 = Apple Silicon Macs (M1 and later).
# Each one is built and tested on a machine of its own kind (no emulation). (Zenodo's GitHub integration
# archives only the source code of a release; the saved images are uploaded to Zenodo by hand.)
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "47 4 1 * *"

permissions:
  contents: read

jobs:
  build:
    name: build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write     # to publish the image
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: wormtransgenebuilder:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Start it and check that it works
        run: |
          docker run -d --name app -p 3838:3838 wormtransgenebuilder:ci
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          echo "health: $status"
          docker logs app
          [ "$status" = "healthy" ]
          curl -fsS http://localhost:3838/ > /dev/null
          docker logs app 2>&1 | grep -q "ViennaRNA 2.7.2"
          docker exec app sh -c 'echo GGGGAAAACCCC | RNAfold --noPS' | grep -F "((((....)))) ( -5.40)"
          echo "architecture inside the image: $(docker exec app uname -m)"

      - name: Log in to the GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish this architecture and save a copy of the image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # The saved file carries the plain version tag, so "docker load" followed by "docker run image:version" works.
          docker tag wormtransgenebuilder:ci "${image}:${version}"
          docker tag wormtransgenebuilder:ci "${image}:${version}-${{ matrix.arch }}"
          docker push "${image}:${version}-${{ matrix.arch }}"
          mkdir saved
          docker save "${image}:${version}" | gzip -n > "saved/wormtransgenebuilder-${version}-linux-${{ matrix.arch }}.tar.gz"
          (cd saved && sha256sum "wormtransgenebuilder-${version}-linux-${{ matrix.arch }}.tar.gz" > "wormtransgenebuilder-${version}-linux-${{ matrix.arch }}.tar.gz.sha256")

      - name: Keep the saved copy for the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: saved-${{ matrix.arch }}
          path: saved/
          retention-days: 7

  release:
    name: publish one image for both, and create the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write     # to attach files to the release
      packages: write     # to publish the image
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: One image name for both architectures
        run: |
          version="${GITHUB_REF_NAME}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create -t "${image}:${version}" -t "${image}:latest" \
            "${image}:${version}-amd64" "${image}:${version}-arm64"
          docker buildx imagetools inspect "${image}:${version}"
          docker buildx imagetools inspect "${image}:${version}" > index.txt
          {
            echo "Image: ${image}:${version}"
            grep -E "^Digest:" index.txt | head -1
            echo "Per architecture:"
            grep -E "Name:|Platform:" index.txt | grep -B1 -E "linux/(amd64|arm64)$" | grep -E "Name:|Platform:"
          } > "wormtransgenebuilder-${version}-image-digest.txt"
          cat "wormtransgenebuilder-${version}-image-digest.txt"

      - uses: actions/download-artifact@v4
        with:
          pattern: saved-*
          path: saved
          merge-multiple: true

      - name: Create the release and attach the saved copies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME}"
          ls -l saved
          gh release view "${version}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1 \
            || gh release create "${version}" --repo "${GITHUB_REPOSITORY}" --title "${version}" --generate-notes
          gh release upload "${version}" --repo "${GITHUB_REPOSITORY}" --clobber saved/* "wormtransgenebuilder-${version}-image-digest.txt"

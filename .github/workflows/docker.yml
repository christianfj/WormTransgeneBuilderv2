# Builds the Docker image and checks that it works. When a version tag (for example v2.1.0) is pushed, it
# also publishes the image to the GitHub Container Registry and attaches a saved copy of the image, with
# its checksum, to the release. (Zenodo's GitHub integration archives only the source code of a release; the
# saved image is uploaded to Zenodo by hand.)
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "47 4 1 * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write     # to attach files to a release
      packages: write     # to publish the image
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (amd64, the server's architecture)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: wormtransgenebuilder:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it and check that it works
        run: |
          docker run -d --name app -p 3838:3838 wormtransgenebuilder:ci
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          echo "health: $status"
          docker logs app
          [ "$status" = "healthy" ]
          curl -fsS http://localhost:3838/ > /dev/null
          docker logs app 2>&1 | grep -q "ViennaRNA 2.7.2"
          docker exec app sh -c 'echo GGGGAAAACCCC | RNAfold --noPS' | grep -F "((((....)))) ( -5.40)"

      - name: Log in to the GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image and attach a saved copy to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag wormtransgenebuilder:ci "${image}:${version}"
          docker tag wormtransgenebuilder:ci "${image}:latest"
          docker push "${image}:${version}"
          docker push "${image}:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:${version}")
          echo "Published ${digest}"
          # A saved copy that can be loaded without any registry: docker load < file
          docker save "${image}:${version}" | gzip -n > "wormtransgenebuilder-${version}-linux-amd64.tar.gz"
          sha256sum "wormtransgenebuilder-${version}-linux-amd64.tar.gz" > "wormtransgenebuilder-${version}-linux-amd64.tar.gz.sha256"
          echo "${digest}" > "wormtransgenebuilder-${version}-image-digest.txt"
          gh release view "${version}" > /dev/null 2>&1 || gh release create "${version}" --title "${version}" --generate-notes
          gh release upload "${version}" --clobber wormtransgenebuilder-${version}-*
